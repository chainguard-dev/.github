# Octo STS policy for image-gen dev environment
# Service account: aexal15-img@aexal15-dev.iam.gserviceaccount.com

issuer: https://accounts.google.com
subject: "106944339722616318248"

permissions:
  # Read github actions logs
  actions: read

  # Read check status
  checks: read

  # Create and push branches with the generated image package
  contents: write

  # Create and update pull requests
  pull_requests: write

  # The bot's trigger, but it also writes back: progress and findings comments
  # on the image request, the skip/halt labels, and the packaging request it
  # files for manifest-gen when the main APK is unpublished.
  issues: write

  # Trigger and manage GitHub Actions workflows
  workflows: write

repositories:
  - stereo

# Octo STS trust policy for the hosted tidy-upper reconciler
# (bots/tidy-upper/cmd/tidy-upper-reconciler in chainguard-dev/mono, deployed
# by env/enforce.dev/iac/400-tidy-upper with OCTO_IDENTITY=tidy-upper).
# tidy-upper mints one org-scoped token per org and octo-sts limits it to the
# repositories listed below. Linear: PSEC-3363 (epic PSEC-3348).
#
# Service account: bot-tidy-upper@prod-enforce-fabc.iam.gserviceaccount.com

issuer: https://accounts.google.com
# gcloud iam service-accounts describe bot-tidy-upper@prod-enforce-fabc.iam.gserviceaccount.com --format='value(uniqueId)'
subject: "115029875307653690774"

permissions:
  # File issues and search for already-filed ones.
  issues: write

  # Read repository visibility for the private-only guard.
  metadata: read

# Every repository tidy-upper may file into: the DepthFirst-scanned private
# chainguard-dev repositories, from prodsec/secure-sdlc/terraform/workflows.tf
# (groups tf-materializer-enabled and tf-non-materializer-private-internal).
# Keep this list explicit and in step with workflows.tf: an empty list means
# every repository the octo-sts App reaches in the org, and tidy-upper writes
# unfixed vulnerability details into the issues it files. A repository missing
# here fails every tidy-upper reconcile for it (three attempts, then
# dead-letter and a Sentinel alert).
repositories:
  - CVE-Dashboard
  - Image-Quality
  - analytics-dlt-salesforce
  - apk-db

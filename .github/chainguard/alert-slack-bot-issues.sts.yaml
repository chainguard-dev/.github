# Issue write for the alert-slack-bot policies that file Materializer issues:
# a digest that finds a file on main needing an edit opens a
# materializer/managed issue for it, after checking for an open one. Kept
# apart from alert-slack-bot.sts.yaml so digests that never file issues keep a
# read-only token; the bot mints this one only for policies that enable it.
issuer: https://accounts.google.com

# alert-slack-bot@prod-enforce-fabc only. Staging would file real issues in the
# same production repos, so it stays on the read-only identity until filing
# has evals.
subject: "115816735061299852605"

permissions:
  issues: write
  metadata: read

repositories:
  - mono
  - stereo

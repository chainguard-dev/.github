# Octo STS policy for the approver-doc-driven identity (production).
# Service account: approver-doc-driven@prod-enforce-fabc.iam.gserviceaccount.com
issuer: https://accounts.google.com
subject: "114533477710399694101"

permissions:
  contents: read
  checks: read
  statuses: read
  pull_requests: write
  # Needed for the ownership gate's team-CODEOWNERS check; without it the
  # gate fails closed to individual @logins and doc authors only.
  members: read

repositories:
- mono
